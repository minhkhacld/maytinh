        // Shift toggle: swap visible panel, keep both in DOM so IDs/values survive untouched.
        function bindShiftToggle() {
            var s1 = document.getElementById('shift1');
            var s2 = document.getElementById('shift2');
            var p1 = document.getElementById('panelShift1');
            var p2 = document.getElementById('panelShift2');

      </div>   -->


        // Live efficiency gauge: watches the #eff result cell that script.js writes into,
        // and animates the ring + colors without needing any change to script.js.
        (function () {
            var CIRC = 339.292;
            var effEl = document.getElementById('eff');
            var arc = document.getElementById('gaugeArc');
            var valueEl = document.getElementById('gaugeValue');
            var labelEl = document.getElementById('gaugeLabel');

            function paint() {
                var raw = (effEl.textContent || '').trim();
                var num = parseFloat(raw.replace(',', '.').replace('%', ''));
                if (isNaN(num)) {
                    arc.style.strokeDashoffset = CIRC;
                    valueEl.textContent = '–';
                    labelEl.textContent = 'Hiệu suất';
                    return;
                }
                var pct = Math.max(0, Math.min(num, 100));
                arc.style.strokeDashoffset = CIRC - (CIRC * pct / 100);
                valueEl.textContent = Math.round(num) + '%';
                var color = '#146B5C', label = 'Đạt mục tiêu';
                if (num < 70) { color = '#B14A3E'; label = 'Dưới mục tiêu'; }
                else if (num < 95) { color = '#C67C2E'; label = 'Gần mục tiêu'; }
                else { color = '#146B5C'; label = 'Đạt / vượt mục tiêu'; }
                arc.style.stroke = color;
                valueEl.style.color = color;
                labelEl.textContent = label;
            }

            new MutationObserver(paint).observe(effEl, { childList: true, characterData: true, subtree: true });
            paint();
        })();
    </script>
