<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Calculator</title>
    <link rel="icon" type="image/x-icon" href="./picture/favicon.ico" />
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v5.13.0/js/all.js" crossorigin="anonymous"></script>

</head>

<body>



    <div class="container" id="title">
        <div class="row">
            <div class="col">
                <h1><i class="fa fa-calculator" aria-hidden="true"></i> Efficiency Calculator</h1>
            </div>
        </div>
    </div>
    <!-- Nhập kết quả -->
    <div class="container">
        <div class="row">
            <div class="col">
                <h3><i class="fa fa-info-circle" aria-hidden="true"></i> Thông tin cơ bản</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-4">
                <div class="form-group">
                    <label for=""><i class="fa fa-clock" aria-hidden="true"></i> SMV</label>
                    <input type="text" class="form-control" name="" id="smv" aria-describedby="helpId"
                        placeholder="Nhập SMV">
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <label for=""><i class="fa fa-cubes" aria-hidden="true"></i> Sản lượng</label>
                    <input type="text" class="form-control" name="" id="sltt" aria-describedby="helpId"
                        placeholder="Nhập sản lượng thực tế">
                </div>
            </div>

            <div class="col-4">
                <div class="form-group">
                    <label for=""><i class="fa fa-flask" aria-hidden="true"></i> Lost time</label>
                    <input type="text" class="form-control" name="" id="losttime" aria-describedby="helpId"
                        placeholder="Nhập Lost time">
                </div>
            </div>
        </div>
        <!-- style 2 -->
        <div class="row">
            <div class="col-4">
                <div class="form-group">
                    <label for=""><i class="fa fa-clock" aria-hidden="true"></i> SMV (2)</label>
                    <input type="text" class="form-control" name="" id="smvhai" aria-describedby="helpId"
                        placeholder="Nhập SMV">
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <label for=""><i class="fa fa-cubes" aria-hidden="true"></i> Sản lượng (2)</label>
                    <input type="text" class="form-control" name="" id="sltthai" aria-describedby="helpId"
                        placeholder="Nhập sản lượng thực tế">
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <label for=""><i class="fa fa-flask" aria-hidden="true"></i> Lost time (2)</label>
                    <input type="text" class="form-control" name="" id="losttimehai" aria-describedby="helpId"
                        placeholder="Nhập Lost time">
                </div>
            </div>

        </div>
        <!-- //Lost time -->
        <div class="row">
            <div class="col-4">
                <div class="form-group">
                    <label for=""> <i class="fa fa-bullseye" aria-hidden="true"></i> Mục tiêu(%)</label>
                    <input type="text" class="form-control" name="" id="tarper" value="100%" aria-describedby="helpId"
                        placeholder="Nhập % (không bắt buộc)">
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <label for=""><i class="fa fa-user" aria-hidden="true"></i> Người (NPT)</label>
                    <input type="text" class="form-control" name="" id="npt-mp" aria-describedby="helpId"
                        placeholder="Người bị ảnh hưởng">
                </div>
            </div>
            <div class="col-4">
                <div class="form-group">
                    <label for=""> <i class="fa fa-hourglass" aria-hidden="true"></i> Giờ (NPT)</label>
                    <input type="text" class="form-control" name="" id="npt-time" aria-describedby="helpId"
                        placeholder="Giờ bị ảnh hưởng">
                </div>
            </div>
        </div>

    </div>
    <!-- Số người và số giờ làm việc -->
    <div class="container">
        <div class="row">
            <div class="col">
                <h3><i class="fa fa-eye" aria-hidden="true"></i> Số người và số giờ làm việc</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-3">
                <div class="form-group">
                    <label for="">7H</label>
                    <input type="text" class="form-control" name="" id="baygio" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for="">7.5H</label>
                    <input type="text" class="form-control" name="" id="baybamuoi" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for="">8.0H</label>
                    <input type="text" class="form-control" name="" id="tamgio" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for="">8.5H</label>
                    <input type="text" class="form-control" name="" id="tambamuoi" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-3">
                <div class="form-group">
                    <label for="">9H</label>
                    <input type="text" class="form-control" name="" id="chingio" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for="">9.5H</label>
                    <input type="text" class="form-control" name="" id="chinbamuoi" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for="">10H</label>
                    <input type="text" class="form-control" name="" id="muoigio" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for="">10.5H</label>
                    <input type="text" class="form-control" name="" id="muoibamuoi" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-3">
                <div class="form-group">
                    <label for="">11H</label>
                    <input type="text" class="form-control" name="" id="muoimotgio" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for="">11.5H</label>
                    <input type="text" class="form-control" name="" id="muoimotbamuoi" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for=""><span><input type="text" class="form-control" name="" id="timeoption1"
                                aria-describedby="helpId" placeholder=""></span></label>
                    <input type="text" class="form-control" name="" id="mpoption1" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group">
                    <label for=""><span><input type="text" class="form-control" name="" id="timeoption2"
                                aria-describedby="helpId" placeholder=""></span></label>
                    <input type="text" class="form-control" name="" id="mpoption2" aria-describedby="helpId"
                        placeholder="">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-group">
                    <i class="fa fa-star" aria-hidden="true"></i>
                    <label for="">Chọn loại hàng</label>
                    <select class="form-control" name="" id="typeofpd">
                        <option value="1">Hàng REI,UA,ASICS,NIKE</option>
                        <option value="2">SPORTFIELD</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row">
            <!-- <div class="col-3"></div> -->
            <div class="col-6">
                <button type="button" id="th_tinhtoan" class="btn btn-primary">Tính Toán</button>
            </div>
            <div class="col-6">
                <button type="button" id="th_lammoi" class="btn btn-primary">Làm Mới</button>
            </div>
            <!-- <div class="col-3"></div> -->
        </div>
    </div>
    <!-- Xuat ket qua -->
    <div class="container">
        <div class="row">
            <div class="col">
                <h3><i class="fa fa-filter" aria-hidden="true"></i> Kết quả</h3>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width:50%">Thông tin cần tính:</th>
                            <th style="width:50%">Kết quả:</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td scope="row"><i class="fa fa-hourglass-start" aria-hidden="true"></i> Attendent Minute
                            </td>
                            <td class="result" id="attent_min"></td>

                        </tr>
                        <tr>
                            <td scope="row"><i class="fa fa-heart" aria-hidden="true"></i> Produce Minute</td>
                            <td class="result" id="produce_min"></td>
                        </tr>
                        <tr>
                            <td scope="row"><i class="fa fa-balance-scale" aria-hidden="true"></i> Dư/Thiếu</td>
                            <td class="result" id="result_min"></td>
                        </tr>
                        <tr>
                            <td scope="row"><i class="fa fa-bullseye" aria-hidden="true"></i> Mục tiêu sản lượng</td>
                            <td class="result" id="target"></td>
                        </tr>
                        <tr>
                            <td scope="row"><i class="fa fa-percent" aria-hidden="true"></i> Hiệu suất</td>
                            <td class="result" id="eff"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
            integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
            crossorigin="anonymous"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
            crossorigin="anonymous"></script>
        <script type="text/javascript" src="script.js">
        </script>
</body>

</html>
